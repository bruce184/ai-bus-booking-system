services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bus_booking
      POSTGRES_USER: bus_app
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bus_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database:/app/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus_app -d bus_booking"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    # depends_on only waits for the container to start, not for Zookeeper to
    # be ready; retry instead of staying dead when Kafka loses that race.
    restart: on-failure:5
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      # The broker binds the advertised-listener port above, not a fixed
      # 9092 (cp-kafka derives KAFKA_LISTENERS from KAFKA_ADVERTISED_LISTENERS
      # when unset) - map host:host, not host:9092, or an overridden
      # KAFKA_PORT forwards to a container port nothing is listening on.
      - "${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"
    healthcheck:
      # Must match KAFKA_ADVERTISED_LISTENERS' port above, not a hardcoded
      # 9092 - the broker actually binds the advertised port, so overriding
      # KAFKA_PORT (e.g. the isolated e2e stack) previously left this probing
      # a port nothing was listening on, permanently unhealthy.
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:${KAFKA_PORT:-9092} --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  bus_postgres_data:
